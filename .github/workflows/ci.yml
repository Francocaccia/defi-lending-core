name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  solidity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5

      - name: Format check
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      # The C++ reference model is built BEFORE the tests; if it fails to build, the job fails.
      # The protocol itself does not depend on it: with no C++ toolchain, `forge test` still
      # passes (the differential tests skip when ffi is off or the binary is missing).
      - name: Build C++ reference model
        run: |
          cmake -S reference-model -B reference-model/build -DCMAKE_BUILD_TYPE=Release
          cmake --build reference-model/build

      - name: C++ unit tests
        run: ctest --test-dir reference-model/build --output-on-failure

      # Fork tests read MAINNET_RPC_URL; with no secret configured they skip, so CI
      # stays green for forks and PRs without secrets.
      - name: Test
        run: forge test -vvv
        env:
          FOUNDRY_PROFILE: ci
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}

      # Solidity vs the independent C++ model (the only profile with ffi enabled).
      - name: Differential tests (Solidity vs C++)
        run: forge test --match-path "test/differential/*" -vvv
        env:
          FOUNDRY_PROFILE: diff

  # Portability check of the model alone: compiles with GCC (Linux) and MSVC (Windows).
  reference-model:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          cmake -S reference-model -B reference-model/build -DCMAKE_BUILD_TYPE=Release
          cmake --build reference-model/build --config Release

      - name: Test
        run: ctest --test-dir reference-model/build -C Release --output-on-failure
